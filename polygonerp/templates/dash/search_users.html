{% extends "base.html" %}

{% block content %}
<h2>Search Users</h2>

<form method="get">
  <label for="name">Name:</label>
  <input type="text" name="name" id="name" placeholder="Enter name" class="form_inp">

  <label for="job_title">Job title:</label>
  <input type="text" name="job_title" id="job_title" placeholder="Enter job title" class="form_inp">

  <label for="email">Email:</label>
  <input type="text" name="email" id="email" placeholder="Enter email" class="form_inp">

  <input type="submit" value="Search" class="sign_in_button">
</form>

{% if users %}
  <h3>Results:</h3>
  <ul>
    {% for user in users %}
      <li class="feck" onclick="location.href='{{ url_for('dash.profile_view', user_id=user.id)}}'">
        <div>{{ user.name}} </div>
        <div>{{ user.job_title}}</div>
        <div>{{ user.email_address}}</div>
      </li>
      <p> </p>
    {% endfor %}
  </ul>
{% elif request.args %}
  <p>No users found.</p>
{% endif %}
{% endblock %}
