{% extends "base.html" %}
{% block content %}

<ul>
{% for project in projects %}
<div>
        <li class="debug">
            <div onclick="location.href='{{ url_for('project.project_detail', project_id=project.id)}}'">{{ project.name }}</div>
            <div class="button-group">
              <button class="sign_in_button" onclick="location.href='{{ url_for('project.edit_project', project_id=project.id)}}'">Edit</button>
              <button class="sign_in_button" onclick="location.href='{{ url_for('project.delete_project', project_id=project.id)}}'">Delete</button>
            </div>
        </li>

</div>
{% endfor %}
</ul>
{% endblock %}
