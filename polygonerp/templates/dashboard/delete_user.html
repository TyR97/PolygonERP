{% extends "base.html" %}

{% block content %}
    <h2>Are you sure you want to delete {{ user.name }}?</h2>
    <form method="post">
        <label>
            <input type="checkbox" name="terminated" value="yes" class="checkmark">
            Is the user's contract terminated?
        </label>
        <div>
       <button type="submit" class="sign_in_button">Yes</button>
       <button type="button" class="sign_in_button" onclick="location.href='{{ url_for('dashboard.search_users') }}'">No</button>
        </div>

    </form>
{% endblock %}
