<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Polygon_ERP</title>
</head>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <div class="dashboard_container" id="dashboard_container">
        <div class="top_row" id="top_row">
            <div class="logo">
                <h1 onclick="location.href='{{ url_for('dashboard.dashboard') }}'">Polygon_ERP</h1>
            </div>
            <button class="back_btn" onclick="history.back()"><- BACK</button>
        </div>
    </div>
{% block content %}
{% endblock %}
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div>
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
